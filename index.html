:root{--bg:#fbf7ff;--card:#fff;--ink:#2b2340;--muted:#6f6787;--line:#e9e2f5;--accent:#7c4dff;--accent-d:#5b2fd6;--pink:#ff6fa5;--teal:#0f9f8f;--ok:#15803d;--okbg:#e8f8ee;--bad:#be123c;--badbg:#fff0f3;--soft:#f3edff;--yellow:#fff7d6}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Rubik,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.65}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:30;background:rgba(251,247,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);margin:-16px -16px 14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.hright{display:flex;align-items:center;gap:10px}
.homeb{background:var(--soft);color:var(--accent-d);border:0;border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:16px;white-space:nowrap}
.homeb:hover{background:#e6dbff}
button,a,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand .logo{flex:none;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--pink));display:grid;place-items:center;color:#fff;font-size:24px}
.brand h1{font-size:22px;margin:0;font-weight:800}
.store{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 2px 10px rgba(80,40,160,.05);margin-bottom:16px}
.hello{background:linear-gradient(135deg,#7c4dff 0%,#b05cff 55%,#ff6fa5 100%);color:#fff;border:0}
.hello h2{margin:0 0 4px;font-size:28px}
.hello p{margin:0;opacity:.95}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:right;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;transition:.15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .ic{font-size:32px}
.tile b{font-size:20px}
.tile span{color:var(--muted);font-size:15px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 22px;font-weight:700;cursor:pointer;font-size:18px}
.btn:hover{background:var(--accent-d)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--soft);color:var(--accent-d)}
.btn.ghost:hover{background:#e6dbff}
.btn.pink{background:var(--pink)}
.btn.small{padding:7px 14px;font-size:15px;border-radius:10px}
.btn.danger{background:#fde2e7;color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:16px}
.chip.on{border-color:var(--accent);background:var(--soft);color:var(--accent-d);font-weight:700}
h2{font-size:24px;margin:0 0 12px}
h3{font-size:19px;margin:16px 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
label.f{display:block;font-weight:500;margin:12px 0 4px}
input[type=text],input[type=number],select,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
/* math */
.eq{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:.5px}
.bigeq{font-size:34px;font-weight:700;text-align:center;margin:10px 0 6px}
.bigeq .eq{font-weight:700}
.blank{display:inline-block;min-width:46px;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center;margin:0 4px}
.sym{color:var(--pink);font-weight:800}
/* quiz */
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prog{flex:1;height:12px;background:var(--soft);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:999px;transition:width .3s}
.timer{font-weight:800;font-size:20px;background:var(--yellow);border-radius:12px;padding:4px 12px;direction:ltr;unicode-bidi:isolate}
.timer.low{background:#ffe1e7;color:var(--bad)}
.tag{display:inline-block;background:var(--soft);color:var(--accent-d);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:500}
.qtext{font-size:21px;margin:12px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:right;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;cursor:pointer;font-size:19px;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--accent-d)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.good .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.numin{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.numin input{width:150px;text-align:center;font-size:30px;font-weight:700;direction:ltr}
.pad{display:grid;grid-template-columns:repeat(5,minmax(52px,64px));gap:8px;justify-content:center;margin-top:12px;direction:ltr}
.pad button{height:54px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:700;cursor:pointer}
.pad button:hover{border-color:var(--accent)}
.passage{background:#fffdf5;border:1px solid #f1e6bf;border-radius:16px;padding:14px 16px;margin-bottom:14px;max-height:360px;overflow:auto}
.passage h4{margin:0 0 8px;font-size:20px;text-align:center}
.pl{display:flex;gap:12px;font-size:18px;line-height:1.9}
.pl .n{flex:none;width:22px;color:#b8a46a;font-size:14px;text-align:center;padding-top:3px}
.fb{border-radius:16px;padding:14px 16px;margin-top:14px}
.fb.ok{background:var(--okbg);border:1px solid #b7e8c8}
.fb.bad{background:var(--badbg);border:1px solid #fbc6d2}
.fb .head{font-weight:800;font-size:20px;margin-bottom:6px}
.fb .why{background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0}
.fb .exp{background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px}
.hintbox{background:var(--yellow);border-radius:12px;padding:8px 12px;margin-top:10px}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;direction:rtl}
.qnav button{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-size:15px}
.qnav button.ans{background:var(--soft);border-color:#cdbcff}
.qnav button.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
/* results */
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--accent-d)}
.stars{font-size:34px;letter-spacing:4px}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:500}
td.num,th.num{text-align:center;direction:ltr;unicode-bidi:isolate}
details.rev{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;background:#fff}
details.rev summary{cursor:pointer;font-weight:500}
.stat{background:var(--soft);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:26px;color:var(--accent-d)}
.stat span{font-size:14px;color:var(--muted)}
.bars .b{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:8px 0;font-size:16px}
.bars .track{height:16px;background:var(--soft);border-radius:999px;overflow:hidden}
.bars .fill{height:100%;background:var(--accent);border-radius:999px}
.bars .v{direction:ltr;unicode-bidi:isolate;text-align:left;font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.tip{position:fixed;pointer-events:none;background:#2b2340;color:#fff;border-radius:10px;padding:6px 10px;font-size:14px;z-index:50;display:none}
.modal{position:fixed;inset:0;background:rgba(30,20,60,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal .card{max-width:460px;width:100%}
.optrow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin:6px 0}
.optrow input[type=radio]{width:22px;height:22px}
.genq{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fff}
.genq.off{opacity:.45}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.confetti{position:fixed;top:-20px;font-size:26px;z-index:60;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
.note{background:var(--yellow);border-radius:12px;padding:10px 14px;font-size:15px}
@media (max-width:560px){body{font-size:17px}.wrap{padding:12px 10px 40px}header.top{margin:-12px -10px 12px;padding:8px 10px}.brand .logo{width:36px;height:36px;font-size:19px;border-radius:11px}.brand h1{font-size:17px}.store{display:none}.card{padding:14px;border-radius:16px}.hello h2{font-size:23px}.tile{padding:14px}.bigeq{font-size:27px}.bars .b{grid-template-columns:105px 1fr 46px}.qtext{font-size:19px}.opt{padding:11px 12px;font-size:18px}.pad{grid-template-columns:repeat(5,1fr);max-width:340px;margin-left:auto;margin-right:auto}.passage{max-height:42vh}.tiles{grid-template-columns:1fr 1fr;gap:10px}.tiles .tile{padding:12px;align-items:center;text-align:center}.tiles .tile span:not(.ic){display:none}.tiles .tile b{font-size:16px}.tiles .tile .ic{font-size:30px}.qbar{flex-wrap:wrap}.qbar .prog{order:5;flex-basis:100%}.btn{padding:12px 18px}}
@media (min-width:561px) and (max-width:1024px){.opt{padding:14px 18px}.pad button{height:58px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="homeBtn" aria-label="מסך הבית"><div class="logo">✨</div><h1 id="appTitle">מבחן מחוננים – כיתה ב'</h1></button>
    <div class="hright"><div class="store" id="storeLbl">טוען…</div><button class="homeb" id="homeBtn2">🏠 דף הבית</button></div>
  </header>
  <main id="app"></main>
</div>
<div class="tip" id="tip"></div>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const app=$('#app');
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pickN=(a,n)=>shuffle(a).slice(0,n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eq=s=>`<span class="eq" dir="ltr">${s}</span>`;
const BL='<span class="blank">?</span>';
const MI='−',X='×',DV='÷',LT='&lt;',GT='&gt;';
const LET=['א','ב','ג','ד','ה','ו'];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const TOUCH=(()=>{try{return matchMedia('(pointer:coarse)').matches}catch(e){return false}})();
const vb=(p,m,f)=>p.g==='f'?f:m;
const fmtTime=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function fmt(t){ // plain text (custom questions) -> safe html with isolated math
  let h=esc(t);
  h=h.replace(/([0-9★▲●♥∆_?]+(?:\s*(?:[+\-−×÷=*:]|&lt;|&gt;)\s*[0-9★▲●♥∆_?]+)+)/g,m=>`<span class="eq" dir="ltr">${m.replace(/_+/g,'<span class="blank">?</span>')}</span>`);
  return h.replace(/\n/g,'<br>');
}

/* ================= state & storage ================= */
const DEF={child:'דניאל',uncle:'דוד רון',sibs:[{name:'יואב',g:'m'},{name:'תמר',g:'f'},{name:'איתי',g:'m'}],hobbies:['שחייה','ריקוד'],songs:['יום הולדת שמח'],foods:['פיצה','תותים'],age:7};
const ST={settings:JSON.parse(JSON.stringify(DEF)),custom:[],results:[],mistakes:[]};
const Store={
  db:null,mode:'local',chain:Promise.resolve(),
  ls(k,d){try{const v=localStorage.getItem('dtest_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  lss(k,v){try{localStorage.setItem('dtest_'+k,JSON.stringify(v))}catch(e){}},
  loadLocal(){ST.settings={...DEF,...this.ls('settings',{})};ST.custom=this.ls('custom',[]);ST.results=this.ls('results',[]);ST.mistakes=this.ls('mistakes',[]);},
  async init(){
    this.loadLocal();
    if(!(window.claude&&typeof claude.use==='function'))return;
    try{
      const db=await Promise.race([claude.use('db'),sleep(10000).then(()=>null)]);
      if(!db)return;
      const t=sleep(10000).then(()=>{throw new Error('timeout')});
      const [s,c,r,m]=await Promise.race([Promise.all([db.doc('app/settings').get(),db.collection('custom').get(),db.collection('results').get(),db.doc('app/mistakes').get()]),t]);
      this.db=db;this.mode='db';
      if(s.exists)ST.settings={...DEF,...s.data()};
      ST.custom=c.docs.map(d=>({...d.data(),id:d.id}));
      ST.results=r.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
      ST.mistakes=m.exists?(m.data().items||[]):[];
    }catch(e){this.db=null;this.mode='local';}
  },
  q(fn){this.chain=this.chain.then(fn).catch(e=>{console.warn(e);toast('לא הצלחתי לשמור – נסו שוב')});return this.chain},
  saveSettings(){if(this.db)return this.q(()=>this.db.doc('app/settings').set(JSON.parse(JSON.stringify(ST.settings))));this.lss('settings',ST.settings)},
  addCustom(o){o.id=o.id||uid();ST.custom.push(o);if(this.db){const {id,...b}=o;return this.q(()=>this.db.collection('custom').doc(id).set(JSON.parse(JSON.stringify(b))))}this.lss('custom',ST.custom)},
  delCustom(id){ST.custom=ST.custom.filter(c=>c.id!==id);if(this.db)return this.q(()=>this.db.collection('custom').doc(id).delete());this.lss('custom',ST.custom)},
  addResult(r){r.id=uid();ST.results.push(r);if(this.db){const {id,...b}=r;return this.q(()=>this.db.collection('results').doc(id).set(b))}this.lss('results',ST.results)},
  saveMistakes(){ST.mistakes=ST.mistakes.slice(-40);if(this.db)return this.q(()=>this.db.doc('app/mistakes').set({items:JSON.parse(JSON.stringify(ST.mistakes))}));this.lss('mistakes',ST.mistakes)}
};
function toast(msg){const d=document.createElement('div');d.className='tip';d.style.cssText='display:block;bottom:20px;left:50%;transform:translateX(-50%);font-size:16px';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ================= people ================= */
function P(){const s=ST.settings;return{child:{name:s.child||'דניאל',g:'f'},dad:{name:'אבא',g:'m'},mom:{name:'אמא',g:'f'},uncle:{name:s.uncle||'דוד רון',g:'m'},sibs:(s.sibs||[]).filter(x=>x.name)}}
const kids=()=>{const p=P();return [p.child,...p.sibs]};
const sibsOnly=()=>{const p=P();return p.sibs.length?p.sibs:[{name:'דניאל',g:'f'},{name:'איתי',g:'m'}]};
const adults=()=>{const p=P();return [p.dad,p.mom,p.uncle]};
const everyone=()=>[...kids(),...adults()];
const hobby=()=>pick(ST.settings.hobbies?.length?ST.settings.hobbies:['ריקוד']);
const song=()=>pick(ST.settings.songs?.length?ST.settings.songs:['יום הולדת שמח']);
const food=()=>pick(ST.settings.foods?.length?ST.settings.foods:['תותים']);
const CH=()=>P().child.name;

/* ================= categories ================= */
const CATS={
  word:{name:'בעיות מילוליות',ic:'🧩',sec:1},
  missing:{name:'השלמת מספר',ic:'❓',sec:1},
  exercise:{name:'תרגילי חשבון',ic:'➕',sec:1},
  ineq:{name:'אי-שוויון',ic:'⚖️',sec:1},
  symbols:{name:'חידות סמלים',ic:'⭐',sec:1},
  series:{name:'סדרות וחוקיות',ic:'🔢',sec:1},
  words:{name:'מילים ויחסים',ic:'🔤',sec:2},
  reading:{name:'הבנת הנקרא',ic:'📖',sec:3},
  custom:{name:'השאלות שלנו',ic:'✏️',sec:2}
};

/* numeric multiple-choice builder */
function mcNum(correct,ds,unit){
  const seen=new Set([correct]);const opts=[{v:correct,why:null}];
  for(const d of ds){if(opts.length>=4)break;if(d.v==null||!Number.isInteger(d.v)||d.v<0||seen.has(d.v))continue;seen.add(d.v);opts.push(d)}
  let k=1;while(opts.length<4){for(const c of [correct+k,correct-k]){if(opts.length<4&&c>=0&&!seen.has(c)){seen.add(c);opts.push({v:c,why:null})}}k++}
  const sh=shuffle(opts);
  return{options:sh.map(o=>unit?`${o.v} ${unit}`:`${o.v}`),correct:sh.findIndex(o=>o.v===correct),why:sh.map(o=>o.why)};
}

/* ================= word problems ================= */
const WORD=[
()=>{const [a,b]=pickN(everyone(),2);const item=pick(['מדבקות','גולות','קלפים','צדפים','חרוזים']);let x=ri(9,29),y=ri(9,29);if((x+y)%2)y++;const s=x+y,h=s/2;const ff=a.g==='f'&&b.g==='f';
 return{kind:'mc',q:`${a.name} ו${b.name} ${ff?'אוספות':'אוספים'} ביחד ${item}. ${a.name} ${vb(a,'הביא','הביאה')} ${x} ${item}, ו${b.name} ${vb(b,'הביא','הביאה')} ${y}. ${ff?'הן החליטו לחלק ביניהן':'הם החליטו לחלק ביניהם'} את כל האוסף באופן שווה. כמה ${item} ${ff?'קיבלה כל אחת':'קיבל כל אחד'}?`,
 ...mcNum(h,[{v:s,why:`${s} הוא מספר כל ה${item} ביחד. אבל צריך עוד לחלק אותן לשניים, כי הן מתחלקות בין שני אנשים.`},{v:Math.abs(x-y)||null,why:`${Math.abs(x-y)} הוא ההפרש בין ${x} ל-${y}. השאלה לא שואלת "כמה יותר", אלא כמה יקבל כל אחד אחרי חלוקה שווה.`},{v:Math.max(x,y),why:`${Math.max(x,y)} זה מה שהיה לאחד מהם בהתחלה – עוד לפני החלוקה.`}],item),
 hint:'קודם תחשבי כמה יש ביחד, ורק אחר כך תחלקי לשניים.',
 explain:`שלב 1 – כמה יש ביחד: ${eq(`${x} + ${y} = ${s}`)}<br>שלב 2 – מחלקים שווה לשניים: ${eq(`${s} ${DV} 2 = ${h}`)}<br>בדיקה: ${eq(`${h} + ${h} = ${s}`)} ✓`}},
()=>{const [a,b,c]=pickN(everyone(),3);const n=ri(2,5),k=pick([3,4]);const B=n*2,C=B*k;const v=p=>vb(p,'קולע','קולעת');
 return{kind:'mc',q:`${a.name} ${v(a)} ${n} סלים במשחק כדורסל. ${b.name} ${v(b)} פי 2 סלים מ${a.name}, ו${c.name} ${v(c)} פי ${k} סלים מ${b.name}. כמה סלים ${v(c)} ${c.name}?`,
 ...mcNum(C,[{v:n*k,why:`${n*k} זה פי ${k} מ${a.name}. אבל צריך פי ${k} מ${b.name} – ו${b.name} ${v(b)} ${B} סלים.`},{v:B,why:`${B} זה מספר הסלים של ${b.name}. עצרת שלב אחד מוקדם מדי – צריך להמשיך אל ${c.name}.`},{v:n+2+k,why:`חיברת את המספרים, אבל "פי 2" ו"פי ${k}" פירושם כפל, לא חיבור.`}],'סלים'),

/* ================= custom questions ================= */
function customToQ(c){
  const q={kind:c.kind==='num'?'num':'mc',cat:c.cat&&CATS[c.cat]?c.cat:'custom',custom:true,cid:c.id,q:fmt(c.q),explain:fmt(c.explain||''),hint:c.hint?fmt(c.hint):''};
  if(q.kind==='mc'){q.options=(c.options||[]).map(fmt);q.correct=+c.correct||0;q.why=(c.options||[]).map((_,i)=>c.why&&c.why[i]?fmt(c.why[i]):null)}
  else{q.answer=Number(c.answer);q.mistakes=(c.mistakes||[]).map(m=>({v:Number(m.v),msg:fmt(m.msg)}))}
  if(c.passage&&c.passage.text){q.passage={id:'c_'+(c.passage.title||c.id),title:esc(c.passage.title||''),lines:c.passage.text.split('\n').filter(l=>l.trim()).map(esc)}}
  return q;
}

/* ================= building a question set ================= */
const GEN={word:()=>pick(WORD)(),missing:genMissing,exercise:genExercise,ineq:genIneq,symbols:()=>Math.random()<.75?genSymbols():genSystem(),series:genSeries};
function buildSet(cats,n,ordered){
  cats=cats.filter(c=>CATS[c]);if(!cats.length)cats=['word','missing'];
  const out=[],seen=new Set();
  const cust=shuffle(ST.custom.map(customToQ));
  const custBy=c=>cust.filter(q=>(q.cat===c)&&!q.used);
  const wb=shuffle(wordsBank());let wi=0;
  const ps=shuffle(passages());let pi=0;
  const custPass=[...new Set(cust.filter(q=>q.passage).map(q=>q.passage.id))];
  const add=q=>{if(seen.has(q.q+(q.options||[]).join()))return false;seen.add(q.q+(q.options||[]).join());out.push(q);return true};
  let guard=0;
  while(out.length<n&&guard++<500){
    for(const c of shuffle(cats)){
      if(out.length>=n)break;
      const cq=custBy(c).filter(q=>!q.passage);
      if(cq.length&&(c==='custom'||Math.random()<.35)){const q=cq[0];q.used=true;add(q);continue}
      if(c==='custom')continue;
      if(c==='reading'){
        const room=n-out.length;if(room<2&&out.length)continue;{const rc=out.filter(x=>x.cat==='reading').length;if(rc>0&&rc+5>Math.round(n*.35))continue;}
        let block;
        const cpi=custPass.find(id=>cust.some(q=>q.passage&&q.passage.id===id&&!q.used));
        if(cpi&&Math.random()<.5){block=cust.filter(q=>q.passage&&q.passage.id===cpi);block.forEach(q=>q.used=true)}
        else{if(pi>=ps.length)continue;const p=ps[pi++];block=p.qs.map(x=>({...x,cat:'reading',passage:{id:p.id,title:p.title,lines:p.lines}}))}
        block.slice(0,Math.max(2,Math.min(block.length,room))).forEach(add);continue;
      }
      if(c==='words'){if(wi<wb.length){add({...wb[wi++],cat:'words'})}continue}
      for(let k=0;k<6;k++){const q=GEN[c]();q.cat=c;if(add(q))break}
    }
    if(cats.every(c=>(c==='custom'&&!custBy('custom').length)||(c==='reading'&&pi>=ps.length)||(c==='words'&&wi>=wb.length))&&!cats.some(c=>GEN[c]))break;
  }
  if(ordered){ // timed: math first, words, then reading (like the real test)
    const rank=q=>CATS[q.cat]?.sec||2;
    const groups=[1,2,3].map(s=>out.filter(q=>rank(q)===s));
    return groups.flat();
  }
  // keep passage questions together
  const res=[],done=new Set();
  for(const q of out){if(q.passage){if(done.has(q.passage.id))continue;done.add(q.passage.id);res.push(...out.filter(x=>x.passage&&x.passage.id===q.passage.id))}else res.push(q)}
  return res;
}

/* ================= stats ================= */
function catStats(){
  const s={};for(const r of ST.results)for(const [c,[ok,t]] of Object.entries(r.cats||{})){s[c]=s[c]||[0,0];s[c][0]+=ok;s[c][1]+=t}
  return s;
}
function weakCats(){
  const s=catStats();const arr=Object.entries(s).filter(([c,[o,t]])=>t>=3&&c!=='custom').map(([c,[o,t]])=>[c,o/t]).sort((a,b)=>a[1]-b[1]);
  return arr.slice(0,3).map(a=>a[0]);
}

  const fin=$('#finish');if(fin)fin.onclick=()=>{const left=QZ.ans.filter(a=>!a||a.given==null||a.given==='').length;confirmBox(left?`נשארו ${left} שאלות בלי תשובה. להגיש בכל זאת?`:'להגיש את המבחן?',()=>finishQuiz(false))};
  app.querySelectorAll('.qnav button').forEach(b=>b.onclick=()=>{trackTime();QZ.i=+b.dataset.j;renderQ()});
  if(answered){const f=$('#fb');f&&f.scrollIntoView({behavior:'smooth',block:'nearest'})}
}
function submitNum(){const v=$('#numA').value.trim();if(v==='')return toast('כתבי מספר');answer(v)}
function isRight(q,g){return q.kind==='mc'?g===q.correct:(g!==''&&g!=null&&Number(g)===Number(q.answer))}
function answer(g){
  const q=QZ.qs[QZ.i];const a=QZ.ans[QZ.i]||(QZ.ans[QZ.i]={tries:[]});if(a.locked)return;a.tries=a.tries||[];
  if(isRight(q,g)){trackTime();a.locked=true;a.solved=true;a.ok=a.tries.length===0;a.given=a.tries.length?a.tries[0]:g;QZ.showHint=false;confetti()}
  else{if(a.tries.some(t=>String(t)===String(g)))return toast('את זה כבר ניסית 🙂');a.tries.push(g);a.showWhy=false;a.msg=pick(['לא בדיוק… נסי שוב! 💪','כמעט! תני לזה עוד ניסיון 🙂','זו לא התשובה – נסי שוב, את יכולה!','עוד לא… חשבי שוב ונסי 🤔'])}
  renderQ();
}
function reveal(){const a=QZ.ans[QZ.i]||(QZ.ans[QZ.i]={tries:[]});if(a.locked)return;trackTime();a.locked=true;a.revealed=true;a.ok=false;a.given=a.tries&&a.tries.length?a.tries[a.tries.length-1]:null;QZ.showHint=false;renderQ()}
function whyText(q,g){if(q.kind==='mc')return (q.why&&q.why[g])||`התשובה "${q.options[g]}" לא מתאימה לנתונים שבשאלה.`;const m=(q.mistakes||[]).find(m=>m.v===Number(g));return m?m.msg:`${eq(esc(g))} זה לא המספר הנכון. כדאי לבדוק: מה הפעולה שהשאלה מבקשת?`}
function tryAgain(q,a){const g=a.tries[a.tries.length-1];const lbl=q.kind==='mc'?LET[g]:eq(esc(g));
  return `<div class="fb bad"><div class="head">${a.msg||'נסי שוב!'}</div>${a.tries.length>1?`<div class="small muted">ניסיונות: ${a.tries.length}</div>`:''}
  ${a.showWhy?`<div class="why"><b>${q.kind==='mc'?'בחרת':'כתבת'} ${lbl} – למה זה לא נכון?</b><br>${whyText(q,g)}</div>`:''}
  <div class="row" style="margin-top:8px">${a.showWhy?'':'<button class="btn ghost small" id="whyBtn">🤔 למה זה לא נכון?</button>'}<button class="btn ghost small" id="showAns">👀 הראה תשובה</button></div></div>`}
function nextQ(){
  if(QZ.mode==='timed'){trackTime();if(QZ.i<QZ.qs.length-1){QZ.i++;renderQ()}else{const left=QZ.ans.filter(a=>!a||a.given==null||a.given==='').length;confirmBox(left?`נשארו ${left} שאלות בלי תשובה. להגיש בכל זאת?`:'להגיש את המבחן?',()=>finishQuiz(false))}return}
  if(QZ.i<QZ.qs.length-1){QZ.i++;QZ.qStart=Date.now();renderQ()}else finishQuiz(false);
}
const PRAISE=()=>pick([`כל הכבוד, ${CH()}! 🎉`,'מעולה! חשבת נכון ⭐','וואו, איזו חשיבה! 🌟','בדיוק! 💪','יופי של תשובה! 🏆']);
const ENC=()=>pick(['כמעט! בואי נבין יחד 💡','לא נורא – ככה לומדים 💪','טעות היא חלק מהלמידה. הנה ההסבר:','זו שאלה מבלבלת! בואי נראה איך חושבים עליה:']);
function feedback(q,a){
  const given=a.given;
  if(a.ok||a.solved)return `<div class="fb ok"><div class="head">${a.ok?PRAISE():`נכון! הצלחת בניסיון ה-${(a.tries||[]).length+1} 👏`}</div><div class="exp"><b>איך חושבים על זה:</b><br>${q.explain}</div></div>`;
  let why=null;
  if(given==null||given==='')why='לא נבחרה תשובה.';
  else why=whyText(q,given);
  const right=q.kind==='mc'?`${LET[q.correct]}. ${q.options[q.correct]}`:eq(q.answer);
  return `<div class="fb bad"><div class="head">${ENC()}</div>
   ${given!=null&&given!==''?`<div class="why"><b>${q.kind==='mc'?`בחרת ${LET[given]}`:`כתבת ${eq(esc(given))}`} – למה זה לא נכון?</b><br>${why}</div>`:`<div class="why">${why}</div>`}
   <div><b>התשובה הנכונה:</b> ${right}</div>
   <div class="exp"><b>בואי נפתור יחד:</b><br>${q.explain}</div></div>`;
}
function confetti(){const em=['⭐','🌟','✨','💜','🎉'];for(let i=0;i<10;i++){const s=document.createElement('div');s.className='confetti';s.textContent=pick(em);s.style.left=ri(5,95)+'vw';s.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2200)}}
function confirmBox(msg,yes){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card"><p style="font-size:19px;margin-top:0">${esc(msg)}</p><div class="row"><button class="btn" id="y">כן</button><button class="btn ghost" id="n">לא, חזרה</button></div></div>`;document.body.appendChild(m);m.querySelector('#y').onclick=()=>{m.remove();yes()};m.querySelector('#n').onclick=()=>m.remove()}

function finishQuiz(timeout,quit,after){
  if(!QZ||QZ.done)return;
  if(QZ.mode==='timed')trackTime();
  QZ.done=true;stopTimer();
  const used=QZ.mode==='timed'?Math.min(elapsed(),QZ.limit):elapsed();
  // grade
  QZ.qs.forEach((q,i)=>{const a=QZ.ans[i];if(QZ.mode==='timed'){const g=a?a.given:null;QZ.ans[i]={given:g,ok:g!=null&&g!==''&&isRight(q,q.kind==='mc'?g:g)}}});
  let idx=QZ.qs.map((_,i)=>i);if(quit)idx=idx.filter(i=>QZ.ans[i]&&QZ.ans[i].locked);
  const total=idx.length,correct=idx.filter(i=>QZ.ans[i]&&QZ.ans[i].ok).length;
  const cats={};idx.forEach(i=>{const c=QZ.qs[i].cat;cats[c]=cats[c]||[0,0];cats[c][1]++;if(QZ.ans[i].ok)cats[c][0]++});
  // mistakes bank
  const keyOf=q=>q.q+(q.options||[]).join('|');
  if(QZ.mode==='review'){idx.forEach(i=>{if(QZ.ans[i].ok){const k=keyOf(QZ.qs[i]);ST.mistakes=ST.mistakes.filter(m=>keyOf(m)!==k)}})}
  else idx.forEach(i=>{if(!QZ.ans[i].ok){const q={...QZ.qs[i]};delete q.used;const k=keyOf(q);if(!ST.mistakes.some(m=>keyOf(m)===k))ST.mistakes.push(q)}});
  if(total){Store.saveMistakes();Store.addResult({mode:QZ.mode,at:new Date().toISOString(),total,correct,sec:Math.round(used),limit:QZ.limit||0,cats,timeout:!!timeout})}
  if(after){go(after);return}
  setHash('results',true);window.scrollTo(0,0);renderResults(idx,total,correct,used,timeout);
}
function renderResults(idx,total,correct,used,timeout){
  const pct=total?Math.round(100*correct/total):0;const stars=pct>=90?3:pct>=70?2:pct>=40?1:0;
  const cats={};idx.forEach(i=>{const c=QZ.qs[i].cat;cats[c]=cats[c]||[0,0];cats[c][1]++;if(QZ.ans[i].ok)cats[c][0]++});
  const wrong=idx.filter(i=>!QZ.ans[i].ok);
  const msg=pct>=90?`מדהים, ${CH()}! 🏆`:pct>=70?'עבודה מצוינת! 🌟':pct>=50?'יפה מאוד – ממשיכים להתאמן 💪':'כל אימון מקרב אותך. בואי נעבור על ההסברים 💜';
  app.innerHTML=`<section class="card"><div class="score">
    <div class="ring" style="background:conic-gradient(var(--accent) ${pct*3.6}deg,var(--soft) 0)"><div style="width:100px;height:100px;border-radius:50%;background:#fff;display:grid;place-items:center"><span style="direction:ltr;unicode-bidi:isolate">${pct}%</span></div></div>
    <div><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h2 style="margin:4px 0">${msg}</h2>
    <div class="muted">${correct} נכונות ${QZ.mode==='timed'?'':'מהניסיון הראשון '}מתוך ${total} · זמן: <span class="eq">${fmtTime(used)}</span>${total?` · בממוצע <span class="eq">${Math.round(used/total)}</span> שניות לשאלה`:''}${timeout?' · ⏰ הזמן נגמר':''}${(()=>{const r=idx.filter(i=>QZ.ans[i].solved&&!QZ.ans[i].ok).length;return r?` · עוד ${r} נפתרו בניסיון נוסף 💪`:''})()}</div></div></div>
   ${total?`<h3>לפי נושא</h3><table><tr><th>נושא</th><th class="num">נכון</th><th class="num">%</th></tr>${Object.entries(cats).map(([c,[o,t]])=>`<tr><td>${CATS[c]?.ic||''} ${CATS[c]?.name||c}</td><td class="num">${o}/${t}</td><td class="num">${Math.round(100*o/t)}%</td></tr>`).join('')}</table>`:''}
   ${wrong.length?`<h3>בואי נלמד מהטעויות (${wrong.length})</h3>${wrong.map(i=>{const q=QZ.qs[i],a=QZ.ans[i];return `<details class="rev" ${QZ.mode==='timed'?'':''}><summary>שאלה ${i+1} · ${CATS[q.cat]?.name||''}</summary>${q.passage?`<details><summary class="small muted">הצגת הקטע</summary>${renderPassage(q.passage)}</details>`:''}<div class="qtext" style="font-size:18px">${q.q}</div>${q.kind==='mc'?`<div class="small">${q.options.map((o,j)=>`<div>${LET[j]}. ${o}${j===q.correct?' ✅':''}${j===a.given?' ⬅️ התשובה שלך':''}</div>`).join('')}</div>`:''}${feedback(q,a)}</details>`}).join('')}`:total?'<p>אין טעויות בכלל! 🎉</p>':''}
   <div class="row" style="margin-top:16px"><button class="btn" id="again">עוד סבב</button><button class="btn ghost" id="prog">להתקדמות</button><button class="btn ghost" id="home">לבית</button></div></section>`;
  $('#home').onclick=()=>go('home');$('#prog').onclick=()=>go('progress');
  $('#again').onclick=()=>go(QZ.mode==='timed'?'timedSetup':QZ.mode==='review'?'home':'practiceSetup');
  if(pct>=70)confetti();
}

function lineChart(pts,{max=100,unit='',label=''}){
  if(pts.length<1)return '<p class="muted">עוד אין נתונים.</p>';
  const W=640,H=230,pl=44,pr=16,pt=16,pb=34;const n=pts.length;
  const x=i=>n===1?(pl+W-pr)/2:pl+(W-pl-pr)*i/(n-1);const y=v=>pt+(H-pt-pb)*(1-v/max);
  const ticks=[0,.25,.5,.75,1].map(f=>Math.round(max*f));
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const every=Math.ceil(n/8);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}" style="direction:ltr">
   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#ece6f6" stroke-width="1"/><text x="${pl-8}" y="${y(t)+4}" font-size="12" fill="#8a83a0" text-anchor="end">${t}${unit}</text>`).join('')}
   <path d="${path}" fill="none" stroke="#7c4dff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="#7c4dff" stroke="#fff" stroke-width="2"/><circle class="hit" cx="${x(i)}" cy="${y(p.v)}" r="16" fill="transparent" data-tip="${esc(p.tip)}"/>${i%every===0||i===n-1?`<text x="${x(i)}" y="${H-10}" font-size="12" fill="#8a83a0" text-anchor="middle">${esc(p.x)}</text>`:''}`).join('')}
  </svg>`;
}
function wireTips(){const tip=$('#tip');app.querySelectorAll('[data-tip]').forEach(el=>{el.addEventListener('mousemove',e=>{tip.style.display='block';tip.textContent=el.dataset.tip;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-36)+'px'});el.addEventListener('mouseleave',()=>tip.style.display='none');el.addEventListener('click',e=>{tip.style.display='block';tip.textContent=el.dataset.tip;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-36)+'px'})})}

   :'<p>עוד אין נתונים. אחרי התרגול או המבחן הראשון יופיעו כאן גרפים.</p>'}

function exportData(){return JSON.stringify({app:'daniel-test',v:1,at:new Date().toISOString(),settings:ST.settings,custom:ST.custom,results:ST.results,mistakes:ST.mistakes})}
function wireBackup(){
  $('#bkDl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([exportData()],{type:'application/json'}));const d=new Date();a.download=`גיבוי-מבחן-${d.getDate()}-${d.getMonth()+1}.json`;document.body.appendChild(a);a.click();a.remove();toast('הקובץ ירד ✓ (אם לא – השתמשו ב"העתקת קוד")')}catch(e){toast('ההורדה לא זמינה כאן – השתמשו ב"העתקת קוד"')}};
  $('#bkCp').onclick=async()=>{const t=exportData();try{await navigator.clipboard.writeText(t);toast('הקוד הועתק ✓ – הדביקו אותו במכשיר השני')}catch(e){$('#bkTxt').value=t;$('#bkTxt').select();toast('סמנו והעתיקו את הקוד מהתיבה')}};
  $('#bkFile').onchange=async e=>{const f=e.target.files[0];if(f)$('#bkTxt').value=await f.text()};
  $('#bkLoad').onclick=async()=>{let d;try{d=JSON.parse($('#bkTxt').value.trim())}catch(e){return toast('הקוד לא תקין')}if(!d||d.app!=='daniel-test')return toast('זה לא קובץ גיבוי של המבחן');await importData(d);toast('הגיבוי נטען ✓');go('home')};
}
async function importData(d){
  const keyOf=q=>q.q+(q.options||[]).join('|');
  if(d.settings)ST.settings={...DEF,...d.settings};
  const newC=(d.custom||[]).filter(c=>c&&c.id&&!ST.custom.some(x=>x.id===c.id));
  const newR=(d.results||[]).filter(r=>r&&r.at&&!ST.results.some(x=>x.id===r.id||x.at===r.at));
  const newM=(d.mistakes||[]).filter(m=>m&&m.q&&!ST.mistakes.some(x=>keyOf(x)===keyOf(m)));
  await Store.saveSettings();
  for(const c of newC)await Store.addCustom({...c});
  for(const r of newR){const {id,...b}=r;ST.results.push(r);if(Store.db)await Store.q(()=>Store.db.collection('results').doc(id||uid()).set(b))}
  ST.results.sort((a,b)=>String(a.at).localeCompare(String(b.at)));if(!Store.db)Store.lss('results',ST.results);
  ST.mistakes.push(...newM);await Store.saveMistakes();setTitle();
}
function sibRow(x){return `<div class="row" style="margin-bottom:8px"><input type="text" value="${esc(x.name)}" placeholder="שם" style="flex:1;min-width:140px"><select style="width:110px"><option value="m" ${x.g!=='f'?'selected':''}>בן</option><option value="f" ${x.g==='f'?'selected':''}>בת</option></select><button class="btn danger small delSib" type="button">הסרה</button></div>`}
function setTitle(){$('#appTitle').textContent=`המבחן של ${CH()}`;document.title=`המבחן של ${CH()}`}

/* ================= add questions ================= */
let addTab='manual',GENQ=[];
SCREENS.addQ=()=>{
  app.innerHTML=`<section class="card"><h2>✏️ הוספת שאלות</h2>
   <div class="tabs"><button class="chip ${addTab==='manual'?'on':''}" data-t="manual">כתיבה ידנית</button><button class="chip ${addTab==='ai'?'on':''}" data-t="ai">✨ יצירה מדוגמה</button><button class="chip ${addTab==='list'?'on':''}" data-t="list">השאלות שהוספנו (${ST.custom.length})</button></div>
   <div id="tab"></div><div class="row" style="margin-top:14px"><button class="btn ghost" id="back">לבית</button></div></section>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{addTab=b.dataset.t;SCREENS.addQ()});
  $('#back').onclick=()=>go('home');
  ({manual:tabManual,ai:tabAI,list:tabList})[addTab]();
};
const catSelect=(id,val)=>`<select id="${id}">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===val?'selected':''}>${v.ic} ${v.name}</option>`).join('')}</select>`;
function tabManual(){
  $('#tab').innerHTML=`<p class="muted small">טיפ: כתבו תרגילים רגילים (למשל 24 − _ = 9) – המספרים יוצגו נכון משמאל לימין, וקו תחתון יהפוך לסימן שאלה.</p>
   <label class="f">נושא</label>${catSelect('mCat','custom')}
   <label class="f">סוג תשובה</label><div class="chips" id="mKind"><button class="chip on" data-k="mc">בחירה מ-4 תשובות</button><button class="chip" data-k="num">כתיבת מספר</button></div>
   <label class="f">השאלה</label><textarea id="mQ" placeholder="למשל: ליואב יש 12 קלפים..."></textarea>
   <details><summary class="small">+ קטע קריאה (לשאלות הבנת הנקרא)</summary><label class="f">כותרת</label><input type="text" id="mPT"><label class="f">הקטע (כל שורה בשורה נפרדת – ממוספרות אוטומטית)</label><textarea id="mP"></textarea></details>
   <div id="mcBox"><label class="f">התשובות – סמנו את הנכונה, ואפשר להוסיף "למה זה לא נכון" לכל תשובה שגויה</label>
    ${[0,1,2,3].map(i=>`<div class="optrow"><input type="radio" name="mCor" value="${i}" ${i===0?'checked':''} aria-label="נכונה"><input type="text" class="mOpt" placeholder="תשובה ${LET[i]}"></div><div class="optrow"><span></span><input type="text" class="mWhy small" placeholder="למה ${LET[i]} לא נכונה? (לא חובה)"></div>`).join('')}</div>
   <div id="numBox" style="display:none"><label class="f">התשובה הנכונה (מספר)</label><input type="number" id="mAns"></div>
   <label class="f">הסבר הפתרון (מוצג אחרי תשובה)</label><textarea id="mEx" placeholder="שלב 1... שלב 2..."></textarea>
   <label class="f">רמז (לא חובה)</label><input type="text" id="mHint">
   <div class="row" style="margin-top:14px"><button class="btn" id="mSave">שמירת השאלה</button></div>`;
  let kind='mc';app.querySelectorAll('#mKind .chip').forEach(b=>b.onclick=()=>{kind=b.dataset.k;app.querySelectorAll('#mKind .chip').forEach(x=>x.classList.toggle('on',x===b));$('#mcBox').style.display=kind==='mc'?'':'none';$('#numBox').style.display=kind==='num'?'':'none'});
  $('#mSave').onclick=async()=>{
    const q=$('#mQ').value.trim();if(!q)return toast('כתבו שאלה');
    const o={cat:$('#mCat').value,kind,q,explain:$('#mEx').value.trim(),hint:$('#mHint').value.trim(),createdAt:new Date().toISOString()};
    if(kind==='mc'){const ops=[...app.querySelectorAll('.mOpt')].map(x=>x.value.trim());const whys=[...app.querySelectorAll('.mWhy')].map(x=>x.value.trim());const cor=+app.querySelector('input[name=mCor]:checked').value;const keep=ops.map((v,i)=>i).filter(i=>ops[i]);if(keep.length<2)return toast('צריך לפחות 2 תשובות');if(!ops[cor])return toast('סמנו תשובה נכונה שאינה ריקה');o.options=keep.map(i=>ops[i]);o.why=keep.map(i=>i===cor?null:(whys[i]||null));o.correct=keep.indexOf(cor)}
    else{const a=$('#mAns').value;if(a==='')return toast('כתבו את התשובה הנכונה');o.answer=Number(a);o.mistakes=[]}
    if($('#mP').value.trim())o.passage={title:$('#mPT').value.trim(),text:$('#mP').value.trim()};
    await Store.addCustom(o);toast('השאלה נשמרה ✓');addTab='list';SCREENS.addQ();
  };
}
function tabList(){
  if(!ST.custom.length){$('#tab').innerHTML='<p class="muted">עוד לא הוספתם שאלות.</p>';return}
  $('#tab').innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn small" id="tryAll">לתרגל את כל השאלות שלנו</button></div>`+ST.custom.slice().reverse().map(c=>{const q=customToQ(c);return `<div class="genq"><div class="row between"><span class="tag">${CATS[q.cat]?.ic} ${CATS[q.cat]?.name}</span><button class="btn danger small" data-del="${esc(c.id)}">מחיקה</button></div>${q.passage?`<div class="small muted">📖 ${q.passage.title||'קטע קריאה'}</div>`:''}<div style="margin-top:6px">${q.q}</div>${q.kind==='mc'?`<div class="small">${q.options.map((o,i)=>`${LET[i]}. ${o}${i===q.correct?' ✅':''}`).join(' · ')}</div>`:`<div class="small">תשובה: ${eq(q.answer)}</div>`}</div>`}).join('');
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmBox('למחוק את השאלה?',async()=>{await Store.delCustom(b.dataset.del);SCREENS.addQ()}));
  $('#tryAll').onclick=()=>{const qs=ST.custom.map(customToQ);startQuiz('practice',shuffle(qs).slice(0,20))};
}
function tabAI(){
  const noAI=!window.claude;
  $('#tab').innerHTML=`${noAI?'<div class="note" style="margin-bottom:10px">יצירה אוטומטית מדוגמה עובדת רק כשפותחים את המבחן דרך Claude. כאן אפשר לכתוב שאלות ידנית – או לשלוח לי דוגמאות בצ\'אט, ואעדכן את המבחן.</div>':''}<p class="muted">הדביקו שאלה לדוגמה (או צלמו דף מחוברת), ו-Claude ייצור שאלות דומות – באותה רמה, עם השמות והתחביבים של ${esc(CH())}, עם הסבר לכל תשובה שגויה. לפני השמירה אפשר לעבור עליהן ולבחור.</p>
   <label class="f">השאלה לדוגמה</label><textarea id="aEx" placeholder="למשל: נועם הכין 21 עוגיות. לכמה ילדים אפשר לחלק את העוגיות כך שכל ילד יקבל מספר שווה? א. 2  ב. 3  ג. 4  ד. 5"></textarea>
   <label class="f">או תמונה של דף (לא חובה)</label><input type="file" id="aImg" accept="image/*">
   <div class="row"><div style="flex:1;min-width:180px"><label class="f">נושא</label>${catSelect('aCat','word')}</div><div style="width:140px"><label class="f">כמה שאלות</label><select id="aN"><option>3</option><option selected>5</option><option>8</option></select></div></div>
   <label class="f">הערות (לא חובה)</label><input type="text" id="aNote" placeholder="למשל: קצת יותר קשה, עם כפל">
   <div class="row" style="margin-top:14px"><button class="btn pink" id="aGo" ${noAI?'disabled':''}>✨ ליצור שאלות</button><button class="btn ghost small" id="aStop" style="display:none">עצירה</button><span id="aSt" class="muted small"></span></div>
   <div id="aOut"></div>`;
  let ctl=null;
  $('#aStop').onclick=()=>ctl&&ctl.abort();
  $('#aGo').onclick=async()=>{
    const ex=$('#aEx').value.trim(),img=$('#aImg').files[0];if(!ex&&!img)return toast('הדביקו דוגמה או בחרו תמונה');
    let sample=null;try{sample=window.claude&&await claude.use('sample')}catch(e){}
    if(!sample){$('#aSt').textContent='יצירה אוטומטית לא זמינה כאן. אפשר לשלוח לי את הדוגמה בצ\'אט ואוסיף את השאלות.';return}
    const s=ST.settings,cat=$('#aCat').value,n=+$('#aN').value;
    const prompt=`את/ה כותב/ת שאלות תרגול בעברית לקראת מבחן מחוננים שלב א' לכיתה ב' בישראל (גיל 7–8).
צור/צרי בדיוק ${n} שאלות חדשות שדומות לדוגמה (אותו סוג חשיבה ואותה רמת קושי, אבל מספרים ותוכן אחרים).
${ex?`הדוגמה:\n"""${ex.slice(0,4000)}"""`:'הדוגמה מופיעה בתמונה המצורפת (דף מחוברת תרגול).'}
${$('#aNote').value.trim()?`הערות ההורה: ${$('#aNote').value.trim()}`:''}
התאמה אישית – שלב/י בשאלות את המשפחה והתחביבים של הילדה (לא בכל שאלה חייבים):
הילדה: ${s.child} (בת). הורים: אבא, אמא. דוד: ${s.uncle}. אחים: ${(s.sibs||[]).map(x=>`${x.name} (${x.g==='f'?'בת':'בן'})`).join(', ')}. חוגים: ${(s.hobbies||[]).join(', ')}. שירים אהובים: ${(s.songs||[]).join(', ')}. דברים אהובים: ${(s.foods||[]).join(', ')}.
הקפד/י על התאמה דקדוקית של זכר/נקבה לכל דמות. אל תצטט/י מילים של שירים – רק את שם השיר.
מספרים בספרות רגילות (0-9). בתרגילים השתמש/י בסימנים + − × ÷ = < > ובמקום מספר חסר כתוב/י _ .
בשאלות בחירה: בדיוק 4 תשובות, ורק אחת נכונה. בדוק/י את החשבון פעמיים.
לכל תשובה שגויה כתוב/י ב-why משפט קצר שמסביר לילדה איזו טעות חשיבה מובילה לתשובה הזו ולמה היא לא נכונה (פנייה בלשון נקבה). לתשובה הנכונה: null.
explain: הסבר פתרון צעד אחרי צעד, בשפה פשוטה לילדה בת 7, עם שורה חדשה (\\n) בין הצעדים.
לשאלות הבנת הנקרא: צור/צרי קטע אחד קצר (8–14 שורות) וכל השאלות עליו, עם אותו passage בכל שאלה; שורות מופרדות ב-\\n ושאלות יכולות להפנות למספר שורה.
החזר/י רק מערך JSON, בלי טקסט נוסף, במבנה:
[{"kind":"mc","q":"...","options":["...","...","...","..."],"correct":0,"why":[null,"...","...","..."],"explain":"...","hint":"...","passage":null}]
או לשאלה פתוחה עם מספר: {"kind":"num","q":"...","answer":12,"mistakes":[{"v":30,"msg":"..."}],"explain":"...","hint":"...","passage":null}
ל-passage (אם יש): {"title":"...","text":"שורה1\\nשורה2"}`;
    ctl=new AbortController();$('#aGo').disabled=true;$('#aStop').style.display='';$('#aSt').textContent='חושב… (זה יכול לקחת עד דקה)';$('#aOut').innerHTML='';
    try{
      const opts={signal:ctl.signal,modelTier:'complex'};if(img)opts.images=[img];
      const arr=await sample.json(prompt,opts);
      const list=(Array.isArray(arr)?arr:(arr&&arr.questions)||[]).filter(validGen).map(q=>({...q,cat}));
      if(!list.length)throw{code:'invalid_json'};
      GENQ=list.map(q=>({q,on:true}));renderGen();$('#aSt').textContent=`נוצרו ${list.length} שאלות. עברו עליהן ובטלו את מה שלא מתאים.`;
    }catch(e){const map={cancelled:'',not_granted:'לא ניתן אישור להשתמש ב-Claude מהעמוד הזה.',rate_limited:'יותר מדי בקשות כרגע – נסו שוב עוד מעט.',images_unavailable:'אי אפשר לשלוח תמונה מכאן – הדביקו את הטקסט.',invalid_json:'התשובה לא התקבלה בפורמט הנכון. נסו שוב.',refused:'הבקשה לא התקבלה. נסו לנסח אחרת.'};$('#aSt').textContent=map[e&&e.code]??'משהו השתבש. נסו שוב.'}
    finally{$('#aGo').disabled=false;$('#aStop').style.display='none'}
  };
}
function validGen(q){if(!q||typeof q.q!=='string'||!q.q.trim())return false;if(q.kind==='num')return Number.isFinite(Number(q.answer));if(!Array.isArray(q.options)||q.options.length<2||q.options.length>6)return false;q.kind='mc';q.correct=Number(q.correct);return Number.isInteger(q.correct)&&q.correct>=0&&q.correct<q.options.length}
function renderGen(){
  $('#aOut').innerHTML=GENQ.map((g,i)=>{const q=customToQ({...g.q,id:'g'+i});return `<div class="genq ${g.on?'':'off'}"><label class="row"><input type="checkbox" data-g="${i}" ${g.on?'checked':''} style="width:22px;height:22px"> <b>שאלה ${i+1}</b></label>${q.passage&&(i===0||GENQ[i-1].q.passage?.text!==g.q.passage?.text)?renderPassage(q.passage):''}<div style="margin:6px 0">${q.q}</div>${q.kind==='mc'?q.options.map((o,j)=>`<div class="small">${LET[j]}. ${o} ${j===q.correct?'✅':q.why[j]?`<span class="muted">— ${q.why[j]}</span>`:''}</div>`).join(''):`<div class="small">תשובה: ${eq(q.answer)}</div>`}<details class="small"><summary>הסבר</summary>${q.explain}</details></div>`}).join('')+`<div class="row"><button class="btn" id="gSave">שמירת השאלות המסומנות</button></div>`;
  app.querySelectorAll('[data-g]').forEach(c=>c.onchange=()=>{GENQ[+c.dataset.g].on=c.checked;c.closest('.genq').classList.toggle('off',!c.checked)});
  $('#gSave').onclick=async()=>{const sel=GENQ.filter(g=>g.on);if(!sel.length)return toast('לא סומנו שאלות');for(const g of sel){const q=g.q;await Store.addCustom({cat:q.cat,kind:q.kind,q:q.q,options:q.options,correct:q.correct,why:q.why,answer:q.answer,mistakes:q.mistakes,explain:q.explain||'',hint:q.hint||'',passage:q.passage||null,createdAt:new Date().toISOString(),source:'ai'})}GENQ=[];toast(`נשמרו ${sel.length} שאלות ✓`);addTab='list';SCREENS.addQ()};
}

(async()=>{

  await Store.init();
  $('#storeLbl').textContent=Store.mode==='db'?'☁️ נשמר בחשבון Claude':'💾 נשמר במכשיר הזה';
  setTitle();if(Store.mode==='db'&&curHash==='home')go('home');
})();
